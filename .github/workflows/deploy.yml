name: Deploy CloudOps Sentinel to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cloudops_key
          chmod 600 ~/.ssh/cloudops_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application on EC2
        id: deploy
        run: |
          ssh -i ~/.ssh/cloudops_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "Starting CloudOps Sentinel deployment..."

            cd ${{ secrets.EC2_PROJECT_PATH }}

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing frontend dependencies..."
            npm install

            echo "Checking memory..."
            echo "Checking server memory..."
            0bbdd53 (Add deployment email notifications to CI/CD)
            free -h

            echo "Building frontend..."
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            echo "Deploying frontend to Nginx..."
            sudo rm -rf /var/www/cloudops-sentinel/*
            sudo cp -r dist/* /var/www/cloudops-sentinel/
            sudo chown -R www-data:www-data /var/www/cloudops-sentinel

            echo "Installing backend dependencies..."
            cd backend
            npm install

            echo "Restarting backend with PM2..."
            pm2 restart cloudops-backend --update-env || pm2 start server.js --name cloudops-backend --update-env
            pm2 save

            echo "Testing Nginx config..."
            sudo nginx -t

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Deployment completed successfully."
          EOF

      - name: Send deployment success email
        if: success()
        run: |
          MESSAGE="Deployment successful for CloudOps Sentinel. Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }} | Commit Message: ${{ github.event.head_commit.message }} | Triggered By: ${{ github.actor }} | Run Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -G "http://${{ secrets.EC2_HOST }}/api/send-alert" \
            --data-urlencode "type=deployment-success" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "force=true"

      - name: Send deployment failure email
        if: failure()
        run: |
          MESSAGE="Deployment failed for CloudOps Sentinel. Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }} | Commit Message: ${{ github.event.head_commit.message }} | Triggered By: ${{ github.actor }} | Run Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -G "http://${{ secrets.EC2_HOST }}/api/send-alert" \
            --data-urlencode "type=deployment-failed" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "force=true"
